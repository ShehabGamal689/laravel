name: Backend CI/CD

on:
  push:
    branches: [ "12.x" ]

jobs:
  test:
    name: Run Laravel tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl, mysql, sqlite
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install --no-interaction --no-progress

      - name: Prepare environment for tests
        run: |
          cp .env.example .env
          php artisan key:generate
          # Use sqlite for tests so we don't hit RDS
          php -r '
            $env = file_get_contents(".env");
            $env = preg_replace("/DB_CONNECTION=.*/", "DB_CONNECTION=sqlite", $env);
            $env = preg_replace("/DB_DATABASE=.*/", "DB_DATABASE=:memory:", $env);
            file_put_contents(".env", $env);
          '

      - name: Run tests
        run: |
          php artisan test

  deploy:
    name: Deploy to backend server
    runs-on: ubuntu-latest
    needs: test   # only run if tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to backend server
        run: |
          echo 'cd /var/www/laravel && ./deploy.sh' | ssh -o StrictHostKeyChecking=no -o LogLevel=ERROR ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST_BACKEND }} bash
